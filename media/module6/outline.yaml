- type: code
  title: SpiTransaction & agent
  language: systemverilog
  source_file: module6/examples/spi_uvm/test_spi_uvm.sv
  code: "/**\n * Module 6: SPI master UVM test (Verilator)\n *\n * SPI agent: transaction,\
    \ sequence, driver, monitor, scoreboard.\n * Driver sends bytes via start/data_in;\
    \ monitor samples MOSI on SCLK (mode 0);\n * scoreboard checks expected vs observed.\n\
    \ */\n\n`include \"uvm_macros.svh\"\nimport uvm_pkg::*;\n\n`timescale 1ns/1ps\n\
    \n// -----------------------------------------------------------------------------\n\
    // Interface\n// -----------------------------------------------------------------------------\n\
    interface spi_master_if;\n    logic        clk;\n    logic        rst_n;\n   \
    \ logic        clk_div_tick;\n    logic        start;\n    logic [7:0]  data_in;\n\
    \    logic        sclk;\n    logic        mosi;\n    logic        cs_n;\n    logic\
    \        busy;\n    logic        done;\nendinterface\n\n// -----------------------------------------------------------------------------\n\
    // Transaction\n// -----------------------------------------------------------------------------\n\
    class SpiTransaction extends uvm_sequence_item;\n    rand logic [7:0] data;\n\
    \    logic [7:0] observed_mosi;\n\n    `uvm_object_utils(SpiTransaction)\n\n \
    \   function new(string name = \"SpiTransaction\");\n        super.new(name);\n\
    \    endfunction\n\n    function string convert2string();\n        return $sformatf(\"\
    data=0x%02h observed_mosi=0x%02h\", data, observed_mosi);\n    endfunction\nendclass\n\
    \n// -----------------------------------------------------------------------------\n\
    // Sequence\n// -----------------------------------------------------------------------------\n\
    class SpiSequence extends uvm_sequence #(SpiTransaction);\n    `uvm_object_utils(SpiSequence)\n\
    \n    function new(string name = \"SpiSequence\");\n        super.new(name);\n\
    // ..."
  narration: SpiTransaction & agent. Review the code on screen and match it to files
    in the repository.
