- type: two_column
  title: 2. UVM agent structure
  left:
  - SpiTransaction = one byte; SpiSequence = directed list; SpiDriver waits on `done`.
  - SpiMonitor samples MOSI on rising SCLK while `cs_n` is low (Mode 0, MSB first).
  - SpiScoreboard compares expected vs `observed_mosi`.
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE6 Design Architecture.
  narration: 2. UVM agent structure. SpiTransaction = one byte; SpiSequence = directed
    list; SpiDriver waits on done. SpiMonitor samples MOSI on rising SCLK while cs_n
    is low (Mode 0, MSB first). SpiScoreboard compares expected vs observed_mosi.
    Refer to the diagram on the right.
- type: two_column
  title: 3. Bus vs DUT checking
  left:
  - Monitor validates wire behavior; `done` alone is not sufficient for sign-off.
  right: assets/diagrams/testing_methods.png
  notes: From MODULE6 Design Architecture.
