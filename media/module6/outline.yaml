- type: section
  title: Key concepts
  narration: 'Next section: Key concepts.'
- type: bullets
  title: 1. Bus-centric verification
  bullets:
  - Monitor rebuilds the byte from SCLK/MOSI/CS_N, not only the DUT status flag.
  notes: From MODULE6 Key Concepts.
  narration: 1. Bus-centric verification. Monitor rebuilds the byte from SCLK/MOSI/CS_N,
    not only the DUT status flag.
- type: bullets
  title: 2. Mode 0 in the monitor
  bullets:
  - Wait for `cs_n` low, then 8 rising edges, MSB first into `observed_mosi`.
  notes: From MODULE6 Key Concepts.
  narration: 2. Mode 0 in the monitor. Wait for cs_n low, then 8 rising edges, MSB
    first into observed_mosi.
- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Sampling MOSI on wrong edge
  bullets:
  - 'Mistake: Using falling SCLK for Mode 0 capture.'
  - 'Correct: Rising-edge samples in SpiMonitor.'
  - 'Why: Scoreboard mismatches even when `done` pulses.'
  notes: From MODULE6 Common Pitfalls.
  narration: 'Sampling MOSI on wrong edge. Mistake: Using falling SCLK for Mode 0
    capture. Correct: Rising-edge samples in SpiMonitor. Why: Scoreboard mismatches
    even when done pulses.'
- type: bullets
  title: Ignoring CS framing
  bullets:
  - 'Mistake: Counting SCLK edges across multiple frames.'
  - 'Correct: Reset bit index when `cs_n` deasserts and a new frame starts.'
  - 'Why: Bytes merge or split incorrectly.'
  notes: From MODULE6 Common Pitfalls.
  narration: 'Ignoring CS framing. Mistake: Counting SCLK edges across multiple frames.
    Correct: Reset bit index when cs_n deasserts and a new frame starts. Why: Bytes
    merge or split incorrectly.'
