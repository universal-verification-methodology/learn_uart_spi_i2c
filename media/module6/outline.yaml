- type: code
  title: Makefile — UVM SPI sim
  language: text
  source_file: module6/examples/spi_uvm/Makefile
  code: "# Makefile for Module 6 SPI UVM test\n#\n# Usage:\n#   make SIM=verilator\
    \ TEST=test_spi_uvm\n#\n\nSIM ?= verilator\nTEST ?= test_spi_uvm\n\n# Prefer externally-set\
    \ UVM_HOME, but fall back to vendored UVM.\n# From module6/examples/spi_uvm, repo\
    \ root is ../../..\nUVM_HOME ?= $(shell echo $$UVM_HOME)\nUVM_HOME_FALLBACK :=\
    \ ../../../tools/uvm-2017/1800.2-2017-1.0\nUVM_HOME_FALLBACK_ALT := ../../../tools/learn_uvm2017_sv_verilator/tools/uvm-2017/1800.2-2017-1.0\n\
    \nifeq ($(UVM_HOME),)\n  ifneq ($(wildcard $(UVM_HOME_FALLBACK)/src/uvm_pkg.sv),)\n\
    \    UVM_HOME := $(UVM_HOME_FALLBACK)\n// ..."
