    on falling edge.'
- type: bullets
  title: 2. Chip select frames
  bullets:
  - '`cs_n` low defines one transfer; typically 8 SCLK cycles per byte.'
  notes: From MODULE5 Key Concepts.
  narration: 2. Chip select frames. cs_n low defines one transfer; typically 8 SCLK
