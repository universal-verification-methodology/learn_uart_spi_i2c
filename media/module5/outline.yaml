- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Wrong SPI mode in head
  bullets:
  - 'Mistake: Sampling on falling edge when using Mode 0.'
  - 'Correct: Rising edge capture, falling edge change for CPOL=0, CPHA=0.'
  - 'Why: Bits will be shifted and MSB/LSB order will look wrong.'
  notes: From MODULE5 Common Pitfalls.
  narration: 'Wrong SPI mode in head. Mistake: Sampling on falling edge when using
    Mode 0. Correct: Rising edge capture, falling edge change for CPOL=0, CPHA=0.
    Why: Bits will be shifted and MSB/LSB order will look wrong.'
- type: bullets
  title: Trusting `done` only
  bullets:
  - 'Mistake: No waveform or bus check on MOSI/SCLK.'
  - 'Correct: Optional VCD review or Module 6 monitor-based check.'
  - 'Why: `done` only means the FSM finished, not that bits were correct.'
  notes: From MODULE5 Common Pitfalls.
  narration: 'Trusting done only. Mistake: No waveform or bus check on MOSI/SCLK.
    Correct: Optional VCD review or Module 6 monitor-based check. Why: done only means
    the FSM finished, not that bits were correct.'
