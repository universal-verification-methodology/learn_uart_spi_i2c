  title: 1. Synchronous serial (SPI)
  bullets:
  - '`sclk` defines bit times; unlike UART there is an explicit clock line.'
  - 'Mode 0: idle low, sample MOSI on rising edge, change on falling edge.'
  notes: From MODULE5 Key Concepts.
  narration: '1. Synchronous serial (SPI). sclk defines bit times; unlike UART there
