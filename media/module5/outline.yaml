- type: code
  title: spi_master — Mode 0 shift
  language: systemverilog
  source_file: module5/examples/spi_baseline/dut/spi_master.v
  code: "// Simple SPI master (mode 0, single slave, 8-bit transfers).\n// This is\
    \ a teaching example: it assumes a clean clk_div_tick input that\n// controls\
    \ SCLK edges and bit timing.\n//\n// Mode 0 (CPOL=0, CPHA=0):\n//   - SCLK idles\
    \ low.\n//   - Data is captured on the rising edge of SCLK.\n//   - Data is changed\
    \ on the falling edge of SCLK.\n\n`timescale 1ns/1ps\n\nmodule spi_master (\n\
    \    input  wire       clk,\n    input  wire       rst_n,       // Active-low\
    \ async reset\n    input  wire       clk_div_tick,// Divider pulse controlling\
    \ SCLK toggling\n    input  wire       start,       // Pulse high for one cycle\
    \ to start transfer\n    input  wire [7:0] data_in,     // Byte to send (MSB first\
    \ on MOSI)\n    output reg        sclk,        // SPI serial clock\n    output\
    \ reg        mosi,        // Master Out, Slave In\n    output reg        cs_n,\
    \        // Active-low chip select\n    output reg        busy,        // High\
    \ while transfer in progress\n    output reg        done         // One-cycle\
    \ pulse at end of transfer\n);\n    typedef enum logic [1:0] {\n        IDLE,\n\
    \        ASSERT_CS,\n        TRANSFER,\n        DEASSERT_CS\n// ..."
  narration: spi_master — Mode 0 shift. Review the code on screen and match it to
    files in the repository.
- type: code
  title: clk_div — SPI clock
  language: systemverilog
  source_file: module5/examples/spi_baseline/dut/clk_div.v
  code: "// Simple clock divider for SPI SCLK timing.\n// Generates a 1-cycle-wide\
    \ clk_div_tick pulse every DIVIDER cycles of clk.\n\n`timescale 1ns/1ps\n\nmodule\
    \ clk_div #(\n    parameter int DIVIDER = 8\n) (\n    input  wire clk,\n    input\
    \  wire rst_n,       // Active-low async reset\n    output reg  clk_div_tick //\
    \ One-cycle pulse at divided rate\n);\n    int count;\n\n    always @(posedge\
    \ clk or negedge rst_n) begin\n        if (!rst_n) begin\n            count  \
    \       <= 0;\n            clk_div_tick <= 1'b0;\n// ..."
  narration: clk_div — SPI clock. Review the code on screen and match it to files
    in the repository.
