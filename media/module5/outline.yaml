- type: code
  title: Makefile — spi_baseline run
  language: text
  source_file: module5/examples/spi_baseline/Makefile
  code: '# Makefile for Module 5 SPI baseline (basic testbench, no UVM)

    #

    # Usage:

    #   make run

    #


    VERILATOR ?= verilator

    TOPLEVEL ?= top_spi_baseline

    DUT_SRC = dut/*.v

    RTL_SRC = top_spi_baseline.sv $(DUT_SRC)

    HARNESS = sim_main.cpp


    VERILATOR_FLAGS = -sv --timing -Wall -Wno-fatal -Wno-TIMESCALEMOD -Wno-WIDTHTRUNC


    .PHONY: run compile clean


    // ...'
  narration: Makefile — spi_baseline run. Review the code on screen and match it to
    files in the repository.
