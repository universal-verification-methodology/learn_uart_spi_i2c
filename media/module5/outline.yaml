- type: code
  title: Directed SPI test
  language: systemverilog
  source_file: module5/examples/spi_baseline/top_spi_baseline.sv
  code: "        start   = 1'b0;\n        data_in = 8'h00;\n\n        wait (rst_n\
    \ === 1'b1);\n        repeat (10) @(posedge clk);\n\n        // Send 0x55\n  \
    \      @(posedge clk);\n        start   = 1'b1;\n        data_in = 8'h55;\n  \
    \      @(posedge clk);\n        start   = 1'b0;\n        wait (done === 1'b1);\n\
    \        $display(\"[PASS] SPI baseline: 0x55 transfer done\");\n\n        repeat\
    \ (20) @(posedge clk);\n\n        // Send 0xAA\n        @(posedge clk);\n    \
    \    start   = 1'b1;\n        data_in = 8'hAA;\n        @(posedge clk);\n// ..."
  narration: Directed SPI test. Review the code on screen and match it to files in
    the repository.
