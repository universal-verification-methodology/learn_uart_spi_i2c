# Per-module overrides for generate_outline_from_module.py
# demos: capture command / expect for terminal screenshots
# architecture: optional code slides (rtl_code, test_code, env_code, make_code) after design section

module1:
  architecture:
    rtl_code:
      title: "counter.v — spec in RTL"
      source_file: module1/examples/spec_to_rtl/dut/counter.v
      max_lines: 22
    test_code:
      title: "sim_main.cpp — directed check"
      source_file: module1/examples/spec_to_rtl/sim_main.cpp
      max_lines: 18
    make_code:
      title: "Makefile — Verilator build & run"
      source_file: module1/examples/spec_to_rtl/Makefile
      max_lines: 16
  demos:
    examples/spec_to_rtl:
      command: "cd module1/examples/spec_to_rtl && make run"
      expect: "[PASS] spec_to_rtl"

