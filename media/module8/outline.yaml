- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Merging address and data checks
  bullets:
  - 'Mistake: One expected byte for the whole transaction.'
  - 'Correct: Separate expected/observed for address+W and data phases.'
  - 'Why: Off-by-one bit in address can hide behind a correct data byte.'
  notes: From MODULE8 Common Pitfalls.
  narration: 'Merging address and data checks. Mistake: One expected byte for the
    whole transaction. Correct: Separate expected/observed for address+W and data
    phases. Why: Off-by-one bit in address can hide behind a correct data byte.'
- type: bullets
  title: Skipping baseline Module 7
  bullets:
  - 'Mistake: Jumping to UVM without understanding inline bus monitor logic.'
  - 'Correct: Run i2c_baseline first; then map monitor to I2cMonitor.'
  - 'Why: UVM monitor is the same idea in a reusable component.'
  notes: From MODULE8 Common Pitfalls.
  narration: 'Skipping baseline Module 7. Mistake: Jumping to UVM without understanding
    inline bus monitor logic. Correct: Run i2c_baseline first; then map monitor to
    I2cMonitor. Why: UVM monitor is the same idea in a reusable component.'
