- type: code
  title: Makefile — UVM I2C sim
  language: text
  source_file: module8/examples/i2c_uvm/Makefile
  code: "# Makefile for Module 8 I2C UVM test\n#\n# Usage:\n#   make SIM=verilator\
    \ TEST=test_i2c_uvm\n#\n\nSIM ?= verilator\nTEST ?= test_i2c_uvm\n\n# Prefer externally-set\
    \ UVM_HOME, but fall back to vendored UVM.\n# From module8/examples/i2c_uvm, repo\
    \ root is ../../..\nUVM_HOME ?= \\\\$(shell echo \\\\$UVM_HOME)\nUVM_HOME_FALLBACK\
    \ := ../../../tools/uvm-2017/1800.2-2017-1.0\nUVM_HOME_FALLBACK_ALT := ../../../tools/learn_uvm2017_sv_verilator/tools/uvm-2017/1800.2-2017-1.0\n\
    \nifeq (\\\\$(UVM_HOME),)\n  ifneq (\\\\$(wildcard \\\\$(UVM_HOME_FALLBACK)/src/uvm_pkg.sv),)\n\
    \    UVM_HOME := \\\\$(UVM_HOME_FALLBACK)\n// ..."
  narration: Makefile — UVM I2C sim. Review the code on screen and match it to files
