- type: code
  title: I2cTransaction & agent
  language: systemverilog
  source_file: module8/examples/i2c_uvm/test_i2c_uvm.sv
  code: "/**\n * Module 4: I2C master UVM test (simplified, single write transaction).\n\
    \ *\n * Teaching example:\n * - Simplified I2C master (no real open-drain or ACK\
    \ handling).\n * - UVM agent requests address+data writes and a monitor reconstructs\
    \ them\n *   from SDA/SCL activity under a single START/STOP frame.\n */\n\n`include\
    \ \"uvm_macros.svh\"\nimport uvm_pkg::*;\n\n`timescale 1ns/1ps\n\n// -----------------------------------------------------------------------------\n\
    // Interface\n// -----------------------------------------------------------------------------\n\
    interface i2c_if;\n    logic clk;\n    logic rst_n;\n    logic start;\n    logic\
    \ [6:0] addr;\n    logic [7:0] data_in;\n    logic scl;\n    logic sda;\n    logic\
    \ clk_div_tick;\n    logic busy;\n    logic done;\nendinterface\n\n// -----------------------------------------------------------------------------\n\
    // Transaction\n// -----------------------------------------------------------------------------\n\
    class I2cTransaction extends uvm_sequence_item;\n    rand logic [6:0] addr;\n\
    \    rand logic [7:0] data;\n    logic [6:0] observed_addr;\n    logic [7:0] observed_data;\n\
    \n    `uvm_object_utils(I2cTransaction)\n\n    function new(string name = \"I2cTransaction\"\
    );\n        super.new(name);\n    endfunction\n\n    function string convert2string();\n\
    \        return $sformatf(\"addr=0x%02h data=0x%02h observed_addr=0x%02h observed_data=0x%02h\"\
    ,\n                         addr, data, observed_addr, observed_data);\n    endfunction\n\
    endclass\n\n// -----------------------------------------------------------------------------\n\
    // Sequence\n// -----------------------------------------------------------------------------\n\
    class I2cSequence extends uvm_sequence #(I2cTransaction);\n// ..."
  narration: I2cTransaction & agent. Review the code on screen and match it to files
    in the repository.
