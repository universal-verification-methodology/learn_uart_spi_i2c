- type: two_column
  title: 1. Transaction-level verification
  left:
  - Stimulus is a transaction (what to write), not raw pin wiggles in `initial` blocks.
  - The monitor reconstructs what happened on the bus; the scoreboard compares to
    expected.
  right: assets/diagrams/testing_methods.png
  notes: From MODULE2 Verification & Testing Methods.
  narration: 1. Transaction-level verification. Stimulus is a transaction (what to
    write), not raw pin wiggles in initial blocks. The monitor reconstructs what happened
    on the bus; the scoreboard compares to expected. Refer to the diagram on the right.
