- type: code
  title: RegTransaction — UVM item
  language: systemverilog
  source_file: module2/examples/uvm_smoke/test_uvm_smoke.sv
  code: "/**\n * Module 2: UVM smoke test (Verilator)\n *\n * Purpose:\n * - Provide\
    \ a *self-contained* UVM test that compiles and runs on Verilator\n * - Demonstrate\
    \ the core UVM structure used later for UART/SPI/I²C:\n *   transaction → sequence\
    \ → driver/monitor → scoreboard\n */\n\n`include \"uvm_macros.svh\"\nimport uvm_pkg::*;\n\
    \n`timescale 1ns/1ps\n\n// -----------------------------------------------------------------------------\n\
    // Interface\n// -----------------------------------------------------------------------------\n\
    interface reg_if;\n    logic clk;\n    logic rst_n;\n    logic enable;\n    logic\
    \ [7:0] d;\n    logic [7:0] q;\nendinterface\n\n// -----------------------------------------------------------------------------\n\
    // Transaction\n// -----------------------------------------------------------------------------\n\
    class RegTransaction extends uvm_sequence_item;\n    rand logic [7:0] d;\n   \
    \ rand bit enable;\n    logic [7:0] observed_q;\n\n    `uvm_object_utils(RegTransaction)\n\
    \n    function new(string name = \"RegTransaction\");\n        super.new(name);\n\
    \    endfunction\n\n    function string convert2string();\n        return $sformatf(\"\
    enable=%0b d=0x%02h observed_q=0x%02h\", enable, d, observed_q);\n    endfunction\n\
    endclass\n\n// -----------------------------------------------------------------------------\n\
    // ..."
  narration: RegTransaction — UVM item. Review the code on screen and match it to
    files in the repository.
