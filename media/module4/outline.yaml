- type: code
  title: UartTxTransaction & agent
  language: systemverilog
  source_file: module4/examples/uart_uvm/test_uart_uvm.sv
  code: "/**\n * Module 4: UART TX/RX UVM test (Verilator)\n *\n * UART agent: transaction,\
    \ sequence, driver, monitor, scoreboard.\n * Loopback: TX output -> RX input;\
    \ scoreboard checks TX (monitor) and RX (hook).\n */\n\n`include \"uvm_macros.svh\"\
    \nimport uvm_pkg::*;\n\n`timescale 1ns/1ps\n\n// -----------------------------------------------------------------------------\n\
    // Interface\n// -----------------------------------------------------------------------------\n\
    interface uart_tx_if;\n    logic clk;\n    logic rst_n;\n    logic start;\n  \
    \  logic [7:0] data;\n    logic tx;\n    logic baud_tick;\nendinterface\n\n//\
    \ -----------------------------------------------------------------------------\n\
    // Transaction\n// -----------------------------------------------------------------------------\n\
    class UartTxTransaction extends uvm_sequence_item;\n    rand logic [7:0] data;\n\
    \    logic [7:0] observed_tx;\n    logic [7:0] observed_rx;\n\n    `uvm_object_utils(UartTxTransaction)\n\
    \n    function new(string name = \"UartTxTransaction\");\n        super.new(name);\n\
    \    endfunction\n\n    function string convert2string();\n        return $sformatf(\"\
    data=0x%02h observed_tx=0x%02h observed_rx=0x%02h\",\n                       \
    \  data, observed_tx, observed_rx);\n    endfunction\nendclass\n\n// -----------------------------------------------------------------------------\n\
    // Sequence\n// -----------------------------------------------------------------------------\n\
    class UartTxSequence extends uvm_sequence #(UartTxTransaction);\n    `uvm_object_utils(UartTxSequence)\n\
    \n    function new(string name = \"UartTxSequence\");\n        super.new(name);\n\
    \    endfunction\n\n    task body();\n// ..."
  narration: UartTxTransaction & agent. Review the code on screen and match it to
    files in the repository.
