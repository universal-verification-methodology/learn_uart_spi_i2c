- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Monitor baud mismatch
  bullets:
  - 'Mistake: Sampling `tx` at system clock instead of `baud_tick` times.'
  - 'Correct: One sample per `baud_tick` per UART rules (as in UartTxMonitor).'
  - 'Why: Reconstructed byte will not match driven data.'
  notes: From MODULE4 Common Pitfalls.
  narration: 'Monitor baud mismatch. Mistake: Sampling tx at system clock instead
    of baud_tick times. Correct: One sample per baud_tick per UART rules (as in UartTxMonitor).
    Why: Reconstructed byte will not match driven data.'
- type: bullets
  title: Forgetting loopback RX check
  bullets:
  - 'Mistake: Scoreboard only compares TX monitor output.'
  - 'Correct: Also call `check_rx_byte` when `data_valid` asserts.'
  - 'Why: TX path can pass while RX is broken.'
  notes: From MODULE4 Common Pitfalls.
  narration: 'Forgetting loopback RX check. Mistake: Scoreboard only compares TX monitor
    output. Correct: Also call check_rx_byte when data_valid asserts. Why: TX path
    can pass while RX is broken.'
