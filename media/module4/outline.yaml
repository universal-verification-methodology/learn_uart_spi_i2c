- type: code
  title: Scoreboard — TX/RX check
  language: systemverilog
  source_file: module4/examples/uart_uvm/test_uart_uvm.sv
  code: "        imp = new(\"imp\", this);\n    endfunction\n\n    function void add_expected(UartTxTransaction\
    \ txn);\n        expected_queue.push_back(txn);\n    endfunction\n\n    function\
    \ void write(UartTxTransaction txn);\n        UartTxTransaction exp;\n       \
    \ if (expected_queue.size() == 0) begin\n            `uvm_warning(\"SCOREBOARD\"\
    , \"No expected transaction available\")\n            return;\n        end\n\n\
    \        exp = expected_queue.pop_front();\n\n        if (txn.observed_tx ===\
    \ exp.data) begin\n            match_count++;\n            `uvm_info(\"SCOREBOARD\"\
    , $sformatf(\"PASS: expected=0x%02h got=0x%02h\",\n                          \
    \                    exp.data, txn.observed_tx), UVM_MEDIUM)\n        end else\
    \ begin\n            mismatch_count++;\n            `uvm_error(\"SCOREBOARD\"\
    , $sformatf(\"FAIL: expected=0x%02h got=0x%02h\",\n                          \
    \                     exp.data, txn.observed_tx))\n        end\n// ..."
  narration: Scoreboard — TX/RX check. Review the code on screen and match it to files
    in the repository.
