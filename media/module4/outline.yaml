  language: systemverilog
  source_file: module4/examples/uart_uvm/test_uart_uvm.sv
  code: "        txn.data = 8'hFF;\n        start_item(txn);\n        finish_item(txn);\n\
    \    endtask\nendclass\n\n// -----------------------------------------------------------------------------\n\
    // Driver\n// -----------------------------------------------------------------------------\n\
    class UartTxDriver extends uvm_driver #(UartTxTransaction);\n    virtual uart_tx_if\
    \ vif;\n\n    `uvm_component_utils(UartTxDriver)\n\n    function new(string name,\
    \ uvm_component parent);\n        super.new(name, parent);\n    endfunction\n\n\
    \    function void build_phase(uvm_phase phase);\n        super.build_phase(phase);\n\
    \        if (!uvm_config_db#(virtual uart_tx_if)::get(this, \"\", \"vif\", vif))\
    \ begin\n            `uvm_fatal(\"NO_VIF\", \"Virtual interface not found\")\n\
    \        end\n    endfunction\n\n    task run_phase(uvm_phase phase);\n      \
    \  UartTxTransaction txn;\n\n// ..."
