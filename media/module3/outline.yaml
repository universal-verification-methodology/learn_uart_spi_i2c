- type: bullets
  title: 'Detail: TX design checklist'
  bullets:
  - 'Inputs: `clk`, `rst_n`, `baud_tick`, `start`, `data_in[7:0]`.'
  - 'Outputs: `tx`, `busy`.'
  - 'Behavior: On `start`, latch `data_in`, drive start bit low, then shift out bits
    [0:7] each `baud_tick`, then drive stop bit high for one...'
  - 'Edge cases: Ignore `start` while `busy` (or queue it in a FIFO if you extend
    the design).'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: TX design checklist. Inputs: clk, rst_n,
    baud_tick, start, data_in[7:0]. Outputs: tx, busy. Behavior: On start, latch data_in,
    drive start bit low, then shift out bits [0:7] each baud_tick, then drive stop
    bit high for one... Edge cases: Ignore start while busy (or queue it in a FIFO
    if you extend the design). From MODULE3 Topics Covered — protocol/design depth.'
- type: bullets
  title: 'Detail: RX design checklist'
  bullets:
  - 'Inputs: `clk`, `rst_n`, `baud_tick`, `rx`.'
  - 'Outputs: `data_out[7:0]`, `data_valid` (pulse), `framing_error`.'
  - 'Behavior: Detect falling edge for start; wait one `baud_tick` to sample mid-start;
    sample 8 bits on successive `baud_tick`s; sample stop...'
  - 'Robustness options: Add metastability sync on `rx`; add oversampling + majority
    vote; add `rx_ready`/`rx_valid` handshake if you later...'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: RX design checklist. Inputs: clk, rst_n,
    baud_tick, rx. Outputs: data_out[7:0], data_valid (pulse), framing_error. Behavior:
    Detect falling edge for start; wait one baud_tick to sample mid-start; sample
    8 bits on successive baud_ticks; sample stop... Robustness options: Add metastability
    sync on rx; add oversampling + majority vote; add rx_ready/rx_valid handshake...'
- type: bullets
  title: 'Detail: Baud generator notes'
  bullets:
  - 'Inputs: `clk`, `rst_n`, `divisor` (constant parameter in the baseline).'
  - 'Output: `baud_tick` high for one cycle every `divisor` clocks.'
  - For synthesis, keep the counter simple (`divisor-1` down-counter or up-counter
