- type: bullets
  title: 'Detail: UART quick reference (8N1) (1)'
  bullets:
  - 'Framing: `idle=1` → `start=0` → 8 data bits (LSB first) → `stop=1`.'
  - 'Baud math: `DIVIDER = round(clk_hz / baud)`. Example: 50 MHz clock, 115200 baud
    → divider ≈ 434.'
  - 'Sampling: Basic design samples once per bit at the `baud_tick`. Production UARTs
    often oversample (e.g., 8x or 16x) to tolerate clock...'
  - 'Reset state: Line idles high, TX not busy, RX clears internal shift register,
    `data_valid` low.'
  notes: From MODULE3 Topics Covered — protocol/design depth.
  narration: 'Protocol and design detail: UART quick reference (8N1) (1). Framing:
    idle=1 → start=0 → 8 data bits (LSB first) → stop=1. Baud math: DIVIDER = round(clk_hz
    / baud). Example: 50 MHz clock, 115200 baud → divider ≈ 434. Sampling: Basic design
    samples once per bit at the baud_tick. Production UARTs often oversample (e.g.,
    8x or 16x) to tolerate clock... Reset state: Line idles high, TX not busy...'
- type: bullets
  title: 'Detail: UART quick reference (8N1) (2)'
  bullets:
  - 'Errors: `framing_error` when stop bit is not high at expected sample; optional
