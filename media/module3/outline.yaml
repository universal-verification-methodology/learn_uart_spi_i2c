- type: code
  title: Loopback directed test
  language: systemverilog
  source_file: module3/examples/uart_baseline/top_uart_baseline.sv
  code: "    // Basic directed test: wait for reset release, send bytes, check RX\n\
    \    initial begin\n        start   = 1'b0;\n        data_in = 8'h00;\n\n    \
    \    wait (rst_n === 1'b1);\n        repeat (10) @(posedge clk);\n\n        //\
    \ Send 0x55\n        @(posedge clk);\n        start   = 1'b1;\n        data_in\
    \ = 8'h55;\n        @(posedge clk);\n        start   = 1'b0;\n        wait (busy\
    \ === 1'b0);\n        wait (data_valid === 1'b1);\n        if (data_out !== 8'h55)\
    \ $error(\"UART baseline: expected 0x55, got 0x%02h\", data_out);\n        else\
    \ $display(\"[PASS] UART baseline: 0x55 loopback OK\");\n\n        repeat (20)\
    \ @(posedge clk);\n\n        // Send 0xAA\n// ..."
  narration: Loopback directed test. Review the code on screen and match it to files
    in the repository.
