- type: section
  title: Key concepts
  narration: 'Next section: Key concepts.'
- type: bullets
  title: 1. Asynchronous serial
  bullets:
  - No dedicated clock wire; TX and RX must share the same bit time (`baud_tick`).
  - Loopback (`rx = tx`) proves TX serialization and RX deserialization together.
  notes: From MODULE3 Key Concepts.
  narration: 1. Asynchronous serial. No dedicated clock wire; TX and RX must share
    the same bit time (baud_tick). Loopback (rx = tx) proves TX serialization and
    RX deserialization together.
- type: bullets
  title: 2. 8N1 frame
  bullets:
  - Idle high → start (0) → 8 data bits LSB first → stop (1).
  - '`busy` on TX; `data_valid` pulse on RX when a byte is ready.'
  notes: From MODULE3 Key Concepts.
  narration: 2. 8N1 frame. Idle high → start (0) → 8 data bits LSB first → stop (1).
    busy on TX; data_valid pulse on RX when a byte is ready.
- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Mismatched baud timing
  bullets:
  - 'Mistake: Different dividers on TX and RX in a loopback test.'
  - 'Correct: One `baud_gen` drives both (as in uart_baseline).'
  - 'Why: RX samples at the wrong bit times.'
  notes: From MODULE3 Common Pitfalls.
  narration: 'Mismatched baud timing. Mistake: Different dividers on TX and RX in
    a loopback test. Correct: One baud_gen drives both (as in uart_baseline). Why:
    RX samples at the wrong bit times.'
- type: bullets
  title: Only checking `busy`
  bullets:
  - 'Mistake: Assuming success when TX finishes.'
  - 'Correct: Wait for `data_valid` and compare `data_out` to the sent byte.'
  - 'Why: `busy` does not prove the loopback byte is correct.'
  notes: From MODULE3 Common Pitfalls.
  narration: 'Only checking busy. Mistake: Assuming success when TX finishes. Correct:
    Wait for data_valid and compare data_out to the sent byte. Why: busy does not
    prove the loopback byte is correct.'
