- type: code
  title: uart_tx — 8N1 frame FSM
  language: systemverilog
  source_file: module3/examples/uart_baseline/dut/uart_tx.v
  code: "// Simple UART transmitter (8N1, no parity) for teaching.\n// This version\
    \ uses an external baud_tick enable (from baud_gen)\n// so that each bit lasts\
    \ many clk cycles in real time, while the\n// internal state machine still advances\
    \ once per baud_tick.\n\n`timescale 1ns/1ps\n\nmodule uart_tx (\n    input  wire\
    \       clk,\n    input  wire       rst_n,      // Active-low async reset\n  \
    \  input  wire       baud_tick,  // One-cycle pulse at baud rate\n    input  wire\
    \       start,      // Pulse high for one cycle to start transmit\n    input \
    \ wire [7:0] data_in,    // Byte to transmit, LSB first on the line\n    output\
    \ reg        tx,         // UART TX line (idle high)\n    output reg        busy\
    \        // High while frame is in progress\n);\n    // 10 bits total: 1 start\
    \ (0), 8 data, 1 stop (1)\n    localparam int FRAME_BITS = 10;\n\n    reg [FRAME_BITS-1:0]\
    \ shift_reg;\n    reg [3:0]            bit_idx; // counts 0..9\n\n    always @(posedge\
    \ clk or negedge rst_n) begin\n        if (!rst_n) begin\n            tx     \
    \   <= 1'b1;           // idle high\n            busy      <= 1'b0;\n        \
    \    shift_reg <= {FRAME_BITS{1'b1}};\n            bit_idx   <= 4'd0;\n// ..."
  narration: uart_tx — 8N1 frame FSM. Review the code on screen and match it to files
    in the repository.
- type: code
  title: uart_rx — start detect & sample
  language: systemverilog
  source_file: module3/examples/uart_baseline/dut/uart_rx.v
  code: "// Simple UART receiver (8N1, no parity) for teaching.\n// This version uses\
    \ an external baud_tick enable (from baud_gen)\n// so that each bit lasts many\
    \ clk cycles in real time, while the\n// RX state machine advances once per baud_tick.\n\
    //\n// Protocol:\n//   - Idle line is high.\n//   - Start bit is a single low\
    \ bit.\n//   - 8 data bits follow, LSB first, one per clock.\n//   - Stop bit\
    \ is a single high bit.\n//\n// This RX block watches the serial line for a start\
    \ bit, then samples\n// one bit per clock to reconstruct the byte. When a full\
    \ frame has\n// been received, it pulses `data_valid` for one cycle with `data_out`.\n\
    \n`timescale 1ns/1ps\n\nmodule uart_rx (\n    input  wire       clk,\n    input\
    \  wire       rst_n,       // Active-low async reset\n    input  wire       baud_tick,\
    \   // One-cycle pulse at baud rate\n    input  wire       rx,          // UART\
    \ RX line (idle high)\n    output reg  [7:0] data_out,    // Reconstructed byte\n\
    \    output reg        data_valid,  // One-cycle pulse when data_out is valid\n\
    \    output reg        framing_error// High for one cycle when stop bit is bad\n\
    );\n    // 10 bits total in a frame: 1 start, 8 data, 1 stop\n    localparam int\
    \ FRAME_BITS = 10;\n// ..."
  narration: uart_rx — start detect & sample. Review the code on screen and match
    it to files in the repository.
- type: code
  title: baud_gen — divider → baud_tick
  language: systemverilog
  source_file: module3/examples/uart_baseline/dut/baud_gen.v
  code: "// Simple baud-rate generator for teaching.\n// Divides the input clock down\
    \ to a 1-cycle-wide baud_tick pulse.\n//\n// Example: For a 50 MHz system clock\
    \ and 115200 baud target,\n// DIVIDER ≈ 50_000_000 / 115200 ≈ 434.\n\n`timescale\
    \ 1ns/1ps\n\nmodule baud_gen #(\n    parameter int DIVIDER = 434  // Default divider,\
    \ can be overridden\n) (\n    input  wire clk,\n    input  wire rst_n,      //\
    \ Active-low async reset\n    output reg  baud_tick   // One-cycle pulse at baud\
    \ rate\n);\n    int count;\n\n    always @(posedge clk or negedge rst_n) begin\n\
    \        if (!rst_n) begin\n            count     <= 0;\n// ..."
  narration: baud_gen — divider → baud_tick. Review the code on screen and match it
    to files in the repository.
