- type: two_column
  title: 1. What we verify in Module 1
  left:
  - RTL behavior matches SPEC.md (reset, enable gating, count progression).
  - 'Directed scenario: release reset, enable for N cycles, expect `count == N`.'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE1 Verification & Testing Methods.
  narration: '1. What we verify in Module 1. RTL behavior matches SPEC.md (reset,
    enable gating, count progression). Directed scenario: release reset, enable for
    N cycles, expect count == N. Refer to the diagram on the right.'
- type: two_column
  title: 2. Stimulus and checking
  left:
  - 'Stimulus: C++ toggles `enable` for a known number of clock cycles.'
  - 'Check: compare `count` to expected value; print PASS/FAIL.'
  - 'Traceability: each check should cite the spec sentence it proves.'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE1 Verification & Testing Methods.
  narration: '2. Stimulus and checking. Stimulus: C++ toggles enable for a known number
    of clock cycles. Check: compare count to expected value; print PASS/FAIL. Traceability:
    each check should cite the spec sentence it proves. Refer to the diagram on the
    right.'
