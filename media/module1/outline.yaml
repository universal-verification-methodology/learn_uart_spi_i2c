- type: section
  title: Design architecture
  narration: 'Next section: Design architecture.'
- type: two_column
  title: 1. Artifact flow (spec_to_rtl)
  left:
  - SPEC.md → requirements in plain language (interface, behavior, timing).
  - dut/counter.v → synthesizable RTL implementing the spec.
  - top.v → wrapper connecting DUT pins to the simulation harness.
  - sim_main.cpp → clock, reset, stimulus, and result checking outside RTL.
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE1 Design Architecture.
  narration: 1. Artifact flow (spec_to_rtl). SPEC.md → requirements in plain language
    (interface, behavior, timing). dut/counter.v → synthesizable RTL implementing
    the spec. top.v → wrapper connecting DUT pins to the simulation harness. sim_main.cpp
    → clock, reset, stimulus, and result checking outside RTL. Refer to the diagram
    on the right.
- type: two_column
  title: 2. Counter DUT structure
  left:
  - '8-bit up-counter: increments when `enable` is high; holds when disabled.'
  - 'Reset: synchronous active-low `rst_n` clears `count` to zero.'
  - 'Ports: `clk`, `rst_n`, `enable`, `count[7:0]` — map directly from the spec interface
    table.'
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE1 Design Architecture.
  narration: '2. Counter DUT structure. 8-bit up-counter: increments when enable is
    high; holds when disabled. Reset: synchronous active-low rst_n clears count to
    zero. Ports: clk, rst_n, enable, count[7:0] — map directly from the spec interface
    table. Refer to the diagram on the right.'
- type: two_column
  title: 3. Simulation harness attachment
  left:
  - C++ generates `clk` and drives `rst_n` / `enable`; reads `count` each cycle.
  - No SystemVerilog testbench yet — you will add structured TB/UVM in Module 2.
  right: assets/diagrams/testing_methods.png
  notes: From MODULE1 Design Architecture.
  narration: 3. Simulation harness attachment. C++ generates clk and drives rst_n
