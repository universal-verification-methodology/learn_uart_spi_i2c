- type: code
  title: counter.v — spec in RTL
  language: systemverilog
  source_file: module1/examples/spec_to_rtl/dut/counter.v
  code: "// 8-bit up-counter — RTL implementation per SPEC.md\n// Module 1: Spec →\
    \ RTL methodology example.\n\n`timescale 1ns/1ps\n\nmodule counter (\n    input\
    \  wire       clk,\n    input  wire       rst_n,\n    input  wire       enable,\n\
    \    output reg  [7:0] count\n);\n    always @(posedge clk) begin\n        if\
    \ (!rst_n)\n            count <= 8'h00;\n        else if (enable)\n          \
    \  count <= count + 8'd1;\n    end\nendmodule"
  narration: counter.v — spec in RTL. Review the code on screen and match it to files
    in the repository.
