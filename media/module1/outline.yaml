- type: code
  title: Makefile — Verilator build & run
  language: text
  source_file: module1/examples/spec_to_rtl/Makefile
  code: '# Makefile for Module 1 spec_to_rtl example

    # Spec → RTL → basic simulation (no UVM).

    #

    # Usage:

    #   make run          Build and run (default)

    #   make run TRACE=1  Build with VCD tracing, then run

    #   make clean        Remove obj_dir and VCD


    TRACE ?= 0

    VERILATOR ?= verilator

    TOPLEVEL ?= top

    DUT_SRC = dut/*.v

    RTL_SRC = top.v $(DUT_SRC)

    HARNESS = sim_main.cpp


    VERILATOR_FLAGS = -cc --exe -Wall

    // ...'
  narration: Makefile — Verilator build & run. Review the code on screen and match
    it to files in the repository.
