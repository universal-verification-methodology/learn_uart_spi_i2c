- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: RTL before spec
  bullets:
  - 'Mistake: Coding counters or FSMs without a written spec.'
  - 'Correct: Complete SPEC.md (or equivalent) first.'
  - 'Why: Reviewers and tests have no golden reference.'
  notes: From MODULE1 Common Pitfalls.
  narration: 'RTL before spec. Mistake: Coding counters or FSMs without a written
    spec. Correct: Complete SPEC.md (or equivalent) first. Why: Reviewers and tests
    have no golden reference.'
- type: bullets
  title: Weak checks
  bullets:
  - 'Mistake: Only printing values without comparing to expected results.'
  - 'Correct: Explicit PASS/FAIL when `count != expected`.'
  - 'Why: Simulation can run without verifying correctness.'
  notes: From MODULE1 Common Pitfalls.
  narration: 'Weak checks. Mistake: Only printing values without comparing to expected
    results. Correct: Explicit PASS/FAIL when count != expected. Why: Simulation can
    run without verifying correctness.'
