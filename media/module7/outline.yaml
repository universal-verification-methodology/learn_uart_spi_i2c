- type: code
  title: Makefile — i2c_baseline run
  language: text
  source_file: module7/examples/i2c_baseline/Makefile
  code: '# Makefile for Module 7 I2C baseline (basic testbench, no UVM)

    #

    # Usage:

    #   make run

    #


    VERILATOR ?= verilator

    TOPLEVEL ?= top_i2c_baseline

    DUT_SRC = dut/*.v

    RTL_SRC = top_i2c_baseline.sv $(DUT_SRC)

    HARNESS = sim_main.cpp


    VERILATOR_FLAGS = -sv --timing -Wall -Wno-fatal -Wno-TIMESCALEMOD -Wno-WIDTHTRUNC


    .PHONY: run compile clean


    // ...'
  narration: Makefile — i2c_baseline run. Review the code on screen and match it to
