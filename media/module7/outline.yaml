- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Ignoring START detection
  bullets:
  - 'Mistake: Sampling bits before a valid START condition.'
  - 'Correct: Detect SDA 1→0 while SCL high, then sample on rising SCL.'
  - 'Why: Reconstructed bytes align to wrong frame boundary.'
  notes: From MODULE7 Common Pitfalls.
  narration: 'Ignoring START detection. Mistake: Sampling bits before a valid START
    condition. Correct: Detect SDA 1→0 while SCL high, then sample on rising SCL.
    Why: Reconstructed bytes align to wrong frame boundary.'
- type: bullets
  title: Expecting full-spec ACK
  bullets:
  - 'Mistake: Assuming teaching RTL models open-drain ACK/NACK.'
  - 'Correct: Treat baseline as sequencing practice; ACK comes in extensions.'
  - 'Why: Our push-pull teaching DUT simplifies the bus.'
  notes: From MODULE7 Common Pitfalls.
  narration: 'Expecting full-spec ACK. Mistake: Assuming teaching RTL models open-drain
    ACK/NACK. Correct: Treat baseline as sequencing practice; ACK comes in extensions.
    Why: Our push-pull teaching DUT simplifies the bus.'
