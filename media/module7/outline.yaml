- type: code
  title: Directed I2C test
  language: systemverilog
  source_file: module7/examples/i2c_baseline/top_i2c_baseline.sv
  code: "        .data_in     (data_in),\n        .scl         (scl),\n        .sda\
    \         (sda),\n        .busy        (busy),\n        .done        (done)\n\
    \    );\n\n    // Monitor: detect START, then sample 8 address bits and 8 data\
    \ bits.\n    initial begin : i2c_monitor\n        int i;\n        captured_addr_w\
    \ = 8'h00;\n        captured_data   = 8'h00;\n\n        wait (rst_n === 1'b1);\n\
    \n        // START: SDA falls while SCL high\n        @(negedge sda);\n      \
    \  if (scl !== 1'b1) begin\n            $display(\"[FAIL] I2C baseline: start\
    \ condition detected but SCL not high\");\n            $finish;\n        end\n\
    \n// ..."
  narration: Directed I2C test. Review the code on screen and match it to files in
    the repository.
- type: section
