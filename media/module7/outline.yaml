- type: code
  title: i2c_master FSM
  language: systemverilog
  source_file: module7/examples/i2c_baseline/dut/i2c_master.v
  code: "// Simple I2C master (baseline write-only, single target).\n// Teaching example:\
    \ we treat SCL/SDA as simple push-pull signals, not full\n// open-drain with multi-master\
    \ arbitration. Focus is on bit timing and\n// start/address/data/stop sequencing.\n\
    //\n// One transaction:\n//   - START\n//   - 7-bit address + write bit (0)\n\
    //   - 8-bit data byte\n//   - STOP\n\n`timescale 1ns/1ps\n\nmodule i2c_master\
    \ (\n    input  wire       clk,\n    input  wire       rst_n,        // Active-low\
    \ async reset\n    input  wire       clk_div_tick, // Divider pulse controlling\
    \ SCL timing\n    input  wire       start,        // Pulse high for one cycle\
    \ to start transfer\n    input  wire [6:0] addr,         // 7-bit I2C address\n\
    \    input  wire [7:0] data_in,      // Byte to send\n    output reg        scl,\
    \          // I2C clock (simplified)\n    output reg        sda,          // I2C\
    \ data (simplified)\n    output reg        busy,         // High while transfer\
    \ in progress\n    output reg        done          // One-cycle pulse at end of\
    \ transfer\n);\n    typedef enum logic [2:0] {\n        IDLE,\n        START_COND,\n\
    \        ADDR_BITS,\n        DATA_BITS,\n// ..."
  narration: i2c_master FSM. Review the code on screen and match it to files in the
    repository.
- type: code
  title: clk_div — SCL timing
  language: systemverilog
  source_file: module7/examples/i2c_baseline/dut/clk_div.v
  code: "// Simple clock divider for I2C SCL timing (teaching example).\n// Generates\
    \ a 1-cycle-wide clk_div_tick pulse every DIVIDER cycles of clk.\n\n`timescale\
    \ 1ns/1ps\n\nmodule clk_div #(\n    parameter int DIVIDER = 8\n) (\n    input\
    \  wire clk,\n    input  wire rst_n,       // Active-low async reset\n    output\
    \ reg  clk_div_tick // One-cycle pulse at divided rate\n);\n    int count;\n\n\
    \    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n\
    \            count        <= 0;\n            clk_div_tick <= 1'b0;\n// ..."
  narration: clk_div — SCL timing. Review the code on screen and match it to files
    in the repository.
