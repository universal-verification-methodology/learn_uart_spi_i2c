- type: bullets
  title: 1. I²C Protocol Essentials
  bullets:
  - 'Bus idle: SCL=1, SDA=1.'
  - 'START: SDA goes 1→0 while SCL is 1.'
  - 'STOP: SDA goes 0→1 while SCL is 1.'
  - 'Address phase: 7-bit address + R/W bit (0=write, 1=read) sent MSB first.'
  - 'Data phase: 8-bit data bytes sent MSB first.'
  - 'ACK/NACK (concept): receiver pulls SDA low for ACK on the 9th clock; high means
    NACK.'
  notes: From MODULE7 Topics Covered.
  narration: '1. I²C Protocol Essentials. Bus idle: SCL=1, SDA=1. START: SDA goes
    1→0 while SCL is 1. STOP: SDA goes 0→1 while SCL is 1. Address phase: 7-bit address
    + R/W bit (0=write, 1=read) sent MSB first. Data phase: 8-bit data bytes sent
    MSB first.'
- type: bullets
  title: 2. Hands-on testbench (i2c_baseline)
  bullets:
  - 'Stimulus: `start`, `addr`, `data_in`, `wait(done)`.'
  - 'Monitor/self-check: reconstruct address+W and data from SCL/SDA; compare to expected.'
  notes: From MODULE7 Topics Covered.
  narration: '2. Hands-on testbench (i2c_baseline). Stimulus: start, addr, data_in,
    wait(done). Monitor/self-check: reconstruct address+W and data from SCL/SDA; compare
    to expected.'
